<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" fill="url(#bg5)"/>
  <!-- Neural network nodes -->
  <g stroke="#a855f7" stroke-width="1.2" opacity="0.6">
    <line x1="70" y1="60" x2="160" y2="90"/>
    <line x1="70" y1="120" x2="160" y2="90"/>
    <line x1="160" y1="90" x2="250" y2="60"/>
    <line x1="160" y1="90" x2="250" y2="120"/>
    <line x1="160" y1="40" x2="160" y2="90"/>
    <line x1="160" y1="90" x2="160" y2="140"/>
  </g>
  <!-- Node circles -->
  <circle cx="70" cy="60" r="14" fill="#6b21a8" stroke="#c084fc" stroke-width="2"/>
  <text x="70" y="64" font-family="-apple-system, sans-serif" font-size="9" fill="#fff" text-anchor="middle">多模态</text>
  <circle cx="70" cy="120" r="14" fill="#6b21a8" stroke="#c084fc" stroke-width="2"/>
  <text x="70" y="124" font-family="-apple-system, sans-serif" font-size="9" fill="#fff" text-anchor="middle">威胁库</text>
  <!-- Central AI Brain Node -->
  <circle cx="160" cy="90" r="28" fill="url(#aiGrad)" stroke="#f0abfc" stroke-width="2.5"/>
  <text x="160" y="88" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">360智脑</text>
  <text x="160" y="103" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#fdf4ff" text-anchor="middle">AI安全大模型</text>
  <!-- Output nodes -->
  <circle cx="250" cy="60" r="14" fill="#6b21a8" stroke="#c084fc" stroke-width="2"/>
  <text x="250" y="64" font-family="-apple-system, sans-serif" font-size="9" fill="#fff" text-anchor="middle">自动化</text>
  <circle cx="250" cy="120" r="14" fill="#6b21a8" stroke="#c084fc" stroke-width="2"/>
  <text x="250" y="124" font-family="-apple-system, sans-serif" font-size="9" fill="#fff" text-anchor="middle">秒级防御</text>
  <!-- Bottom info bar -->
  <rect x="20" y="168" width="280" height="42" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b"/>
  <text x="35" y="186" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#e879f9">360智脑 · AI安全大模型协同防御架构</text>
  <text x="35" y="201" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94a3b8">百亿参数研判 · 自动化生成对抗与防御策略</text>
</svg>
