<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" fill="url(#bg1)"/>
  <!-- Cyber grid -->
  <g stroke="#1e3a8a" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="40" x2="320" y2="40"/>
    <line x1="0" y1="80" x2="320" y2="80"/>
    <line x1="0" y1="120" x2="320" y2="120"/>
    <line x1="0" y1="160" x2="320" y2="160"/>
    <line x1="60" y1="0" x2="60" y2="220"/>
    <line x1="120" y1="0" x2="120" y2="220"/>
    <line x1="180" y1="0" x2="180" y2="220"/>
    <line x1="240" y1="0" x2="240" y2="220"/>
  </g>
  <!-- Radar circles -->
  <circle cx="160" cy="95" r="65" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="160" cy="95" r="42" fill="none" stroke="#0ea5e9" stroke-width="1.2" opacity="0.8"/>
  <circle cx="160" cy="95" r="18" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Central 360 Cyber Shield -->
  <path d="M 160 68 L 182 78 L 182 102 C 182 118 160 128 160 128 C 160 128 138 118 138 102 L 138 78 Z" fill="url(#shieldGrad)" stroke="#e0f2fe" stroke-width="1.5"/>
  <text x="160" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="900" fill="#0b132b" text-anchor="middle">360</text>
  <!-- Scanning sweep line -->
  <line x1="160" y1="95" x2="215" y2="60" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <!-- Pulsing threat dots -->
  <circle cx="125" cy="80" r="3.5" fill="#10b981"/>
  <circle cx="195" cy="115" r="4" fill="#f43f5e"/>
  <circle cx="210" cy="75" r="3" fill="#38bdf8"/>
  <!-- Bottom info bar -->
  <rect x="20" y="156" width="280" height="46" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b"/>
  <text x="35" y="176" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">360安全大脑 · 态势感知指挥大屏</text>
  <text x="35" y="193" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94a3b8">全网威胁实时遥测 · 0.1s 智能响应拦截</text>
</svg>
