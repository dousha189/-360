<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="stampGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" fill="url(#bg4)"/>
  <!-- Parchment/certificate inner -->
  <rect x="25" y="20" width="270" height="145" rx="6" fill="#132a26" stroke="#059669" stroke-width="1.5"/>
  <!-- Shield icon -->
  <path d="M 75 45 L 90 52 L 90 70 C 90 82 75 90 75 90 C 75 90 60 82 60 70 L 60 52 Z" fill="#10b981" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="75" y="73" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" fill="#064e3b" text-anchor="middle">360</text>
  <text x="175" y="55" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#a7f3d0" text-anchor="middle">360安全科技股份有限公司</text>
  <text x="175" y="74" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="middle">国家信息安全漏洞库一级技术支撑</text>
  <text x="175" y="92" font-family="-apple-system, sans-serif" font-size="9.5" fill="#6ee7b7" text-anchor="middle">高新技术企业认证 · ISO27001 信息安全认证</text>
  <!-- Red official stamp seal -->
  <circle cx="240" cy="115" r="24" fill="none" stroke="url(#stampGrad)" stroke-width="2" opacity="0.85"/>
  <text x="240" y="113" font-family="-apple-system, sans-serif" font-size="8" font-weight="bold" fill="#ef4444" text-anchor="middle">中国数字安全</text>
  <text x="240" y="123" font-family="-apple-system, sans-serif" font-size="8" font-weight="bold" fill="#ef4444" text-anchor="middle">权威验证章</text>
  <!-- Bottom info bar -->
  <rect x="20" y="172" width="280" height="38" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b"/>
  <text x="35" y="194" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#34d399">360数字安全集团权威企业资质与认证</text>
</svg>
