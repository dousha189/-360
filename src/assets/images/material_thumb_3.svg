<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" fill="url(#bg3)"/>
  <!-- Certificate border -->
  <rect x="25" y="20" width="270" height="145" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#ca8a04" stroke-width="1.5"/>
  <rect x="32" y="27" width="256" height="131" rx="4" fill="none" stroke="#eab308" stroke-width="0.75" stroke-dasharray="3 3"/>
  <!-- Gold Badge Crest -->
  <polygon points="160,38 185,55 175,85 145,85 135,55" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1"/>
  <polygon points="160,44 178,57 170,80 150,80 142,57" fill="#854d0e"/>
  <!-- Star -->
  <text x="160" y="69" font-family="-apple-system, sans-serif" font-size="18" fill="#fef08a" text-anchor="middle">★</text>
  <text x="160" y="108" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#fef08a" text-anchor="middle">信息系统安全等级保护</text>
  <text x="160" y="126" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#cbd5e1" text-anchor="middle">国家等保三级 · 测评合格认证</text>
  <text x="160" y="142" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">发证机关：公安部第一研究所测评中心</text>
  <!-- Bottom info bar -->
  <rect x="20" y="172" width="280" height="38" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b"/>
  <text x="35" y="194" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#facc15">国家等保三级备案测评认证证书</text>
</svg>
